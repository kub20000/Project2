<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신규 강의 등록</title>
    <!-- 헤더 css -->
    <link rel="stylesheet" href="../adminBaseCss/header/adminHeader.css">
    <!-- 푸터 css -->
    <link rel="stylesheet" href="../adminBaseCss/footer/adminFooter.css">
    <!-- 사이드바 css -->
    <link rel="stylesheet" href="../adminBaseCss/sidebar/adminSidebar.css">
    <!-- 공통 css -->
    <link rel="stylesheet" href="../adminBaseCss/adminCommon.css">
    <!-- 강의 등록 전용 css -->
    <link rel="stylesheet" href="css/adminCourseAdd.css">
</head>

<body>
    <!-- 헤더(헤더 css) -->
    <header id="admin_header">
        <a href="http://127.0.0.1:5500/home/home.html" class="main_logo"><img src="img/logo.png" alt="logo"></a>
        <div class="admin_info">
            <p>관리자 님</p>
            <a href="#" id="admin_logout" class="admin_logout_link">Logout</a>
        </div>
    </header>
    <!-- 사이드바(사이드바 css, 공통 js) -->
    <div id="admin_sidebar">
        <a href="../adminHome/adminHome.html" class="admin_home">DashBoard</a>
        <div class="admin_sidebar_menu">
            <ul>
                <li class="aSidebar_sub">
                    <button type="button" class="sidebar_toggle">👤 회원</button>
                    <ul class="aSidebar_sub_menu">
                        <li><a href="../adminUser/adminUser.html">회원관리</a></li>
                    </ul>
                </li>

                <li class="aSidebar_sub">
                    <button type="button" class="sidebar_toggle">📚 교육</button>
                    <ul class="aSidebar_sub_menu">
                        <li><a href="../adminCourseList/adminCourseList.html">강의목록</a></li>
                        <li><a href="../adminCourseAdd/adminCourseAdd.html" class="active">신규강의등록</a></li>
                        <li><a href="#">교육자료</a></li>
                        <li><a href="#">교육자료등록</a></li>
                    </ul>
                </li>

                <li class="aSidebar_sub">
                    <button type="button" class="sidebar_toggle">💬 소식센터</button>
                    <ul class="aSidebar_sub_menu">
                        <li><a href="#">공지사항</a></li>
                        <li><a href="#">공지사항등록</a></li>
                        <li><a href="#">문의사항</a></li>
                        <li><a href="#">보도자료</a></li>
                        <li><a href="#">보도자료등록</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
    <main id="container">
        <!-- 맨 위 타이틀 (공통 css) -->
        <div class="main_title"><a href="../adminCourseAdd/adminCourseAdd.html">강의등록</a></div>
        <!-- 등록 폼 (공통 CSS) -->
        <div class="admin_add_cont">
            <form id="admin_course_add_form" class="admin_add_form" enctype="multipart/form-data">

                <!-- 강의명 -->
                <div class="admin_form_group">
                    <label for="courseTitle" class="form_label_title">강의명</label>
                    <input type="text" id="courseTitle" name="courseTitle" placeholder="강의명을 입력하세요." required>
                </div>

                <!-- 강의 분류 -->
                <div class="admin_form_group admin_select_group">
                    <label for="courseSelect" class="form_label_title">강의 분류</label>
                    <div class="admin_select_row">
                        <label for="courseMainSelect" class="form_label_subject">대주제 : </label>
                        <select id="courseMainSelect" name="courseMain" class="admin_select_main" required>
                            <option value="">- 대주제를 선택하세요 -</option>
                            <option value="자가 응급 처치">자가 응급 처치</option>
                            <option value="구조자 응급 처치">구조자 응급 처치</option>
                        </select>

                        <label for="courseSubSelect" class="form_label_subject">세부 주제 : </label>
                        <select id="courseSubSelect" name="courseSub" class="admin_select_sub" required>
                            <option value="">- 세부 주제를 선택하세요 -</option>
                            <option value="출혈">출혈</option>
                            <option value="기도 막힘">기도 막힘</option>
                            <option value="심정지">심정지</option>
                            <option value="골절">골절</option>
                        </select>
                    </div>
                    <p class="form_guide">※ 대주제를 먼저 선택한 후 세부 주제를 선택하세요.</p>
                </div>

                <!-- 과정 설명 -->
                <div class="admin_form_group admin_textarea_group">
                    <label for="courseDesc" class="form_label_title">강의 과정 설명</label>
                    <textarea id="courseDesc" name="courseDesc" class="admin_textarea"
                        placeholder="강의에 대한 간단한 소개를 입력하세요." rows="5" required></textarea>
                </div>

                <!-- 강의 썸네일 -->
                <div class="admin_form_group course_thumb_group">
                    <label for="courseThumb" class="form_label_title">강의 썸네일</label>
                    <input type="file" id="addCourseThumb" name="courseThumb" accept="image/*" required>
                    <p class="form_guide">※ 강의 목록에 표시될 대표 이미지를 등록하세요.</p>
                    <div class="preview_box">
                        <img id="addThumbPreview" src="" alt="썸네일 미리보기" style="display:none;">
                    </div>
                </div>

                <!-- 강의 영상 -->
                <div class="admin_form_group course_video_group">
                    <label class="form_label_title">강의 영상</label>
                    <div class="upload_box">
                        <div class="upload_input">
                            <label for="courseVideo1">영상 1</label>
                            <input type="file" id="courseVideo1" name="courseVideo1" accept="video/*" required>
                        </div>
                        <div class="upload_input">
                            <label for="courseVideo2">영상 2</label>
                            <input type="file" id="courseVideo2" name="courseVideo2" accept="video/*">
                        </div>
                        <div class="upload_input">
                            <label for="courseVideo3">영상 3</label>
                            <input type="file" id="courseVideo3" name="courseVideo3" accept="video/*">
                        </div>
                    </div>
                </div>

                <!-- 강의 등록, 취소 버튼 -->
                <div class="admin_form_btns">
                    <button type="submit" id="admin_course_submitBtn" class="admin_submit_btn">등록</button>
                    <button type="button" id="admin_course_cancelBtn" class="admin_cancel_btn">취소</button>
                </div>
            </form>
        </div>
    </main>
    <!-- 푸터(푸터 css) -->
    <div id="admin_footer">
        ⓒ 2025 LIFE SAVER. All rights reserved.
    </div>
</body>
<!-- 공통 js -->
<script src="../adminBaseJs/adminCommon.js"></script>
<!-- 강의 등록 전용 js -->
<script src="js/adminCourseAdd.js"></script>

</html>
